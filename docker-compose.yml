services:
  app:
    build: .
    image: izmir-ag-haritasi:latest
    container_name: izmir-ag-haritasi
    ports:
      - "${HOST_PORT:-8090}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
